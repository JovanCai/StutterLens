name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'arm64' && 'windows-11-arm' || 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        # GitHub 的 Windows ARM 托管机器只对公开仓库免费，私有仓库时只跑 x64
        arch: ${{ fromJSON(github.event.repository.private && '["x64"]' || '["x64","arm64"]') }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build StutterLens.sln -c Release

      - name: Test
        run: dotnet test StutterLens.sln -c Release --no-build

      - name: Publish
        run: dotnet publish src/StutterLens -p:PublishProfile=win-${{ matrix.arch }}

      - name: Check single-file exe runs
        shell: pwsh
        run: |
          $v = & artifacts/publish/win-${{ matrix.arch }}/StutterLens.exe --version
          Write-Host $v
          if ($LASTEXITCODE -ne 0) { exit 1 }
